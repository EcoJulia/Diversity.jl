name: CompatHelper

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM

jobs:
  CompatHelper:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version:
          - '1'
        # x64, not x86: this is an infrastructure job, not a compatibility matrix, and 32-bit
        # Julia is where CompatHelper's TLS stack (HTTP → Reseau) fails to precompile.
        arch:
          - x64
        os:
          - ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: "Install CompatHelper"
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: "Run CompatHelper"
        run: |
          import CompatHelper
          CompatHelper.main()
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
