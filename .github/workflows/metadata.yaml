name: Metadata and hygene

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
  actions: write
  contents: read

jobs:
  metadata:
    name: RSMD - ${{ github.event_name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - name: Cache
        uses: julia-actions/cache@v3
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
      # Asks for the hygiene set by name. `test/extras_clean.jl` runs when it is named or when
      # running locally, and skips on a CI runner that merely reached it as part of the whole suite -
      # so this job is the only place in CI the crosswalk and formatter checks run.
      - name: Running
        run: julia --project -e 'using Pkg; Pkg.test(test_args = ["extras_clean.jl"])'
